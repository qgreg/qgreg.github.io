<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<!-- Unlisted: nothing on the site links here, and search engines are asked to
     stay away. The URL still works for anyone it is handed to. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A checklist you can write and tick off. Saved in your own browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1;
    --rule:#E3DED1;
    --margin-line:#D98A7B;
    --ink:#1F1C17;
    --ink-soft:#6B6357;
    --indigo:#39397B;
    --highlighter:#FFE066;
    --done:#5C8A5E;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    /* ruled paper */
    background-image:linear-gradient(var(--rule) 1px, transparent 1px);
    background-size:100% 32px;
    color:var(--ink);
    font-family:Inter, "Helvetica Neue", Arial, sans-serif;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 20px 96px;
  }

  /* Signature: the red margin rule down the left of the sheet */
  .sheet{
    position:relative;
    background:#fff;
    border:1px solid var(--rule);
    box-shadow:0 1px 0 rgba(31,28,23,.04), 0 12px 28px -20px rgba(31,28,23,.4);
    padding:32px 28px 28px 44px;
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0;bottom:0;left:26px;
    width:1px;
    background:var(--margin-line);
    opacity:.55;
  }

  h1{
    font-family:Fraunces, Georgia, serif;
    font-weight:600;
    font-size:clamp(28px,6vw,40px);
    line-height:1.15;
    margin:0;
    outline:none;
  }
  h1:empty::before{
    content:attr(data-placeholder);
    color:#B9B1A3;
  }
  h1:focus-visible{
    background:linear-gradient(transparent 62%, var(--highlighter) 62%);
  }
  .title-hint{
    margin:6px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .count{
    margin:20px 0 0;
    font-size:13px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--indigo);
  }
  .bar{
    height:4px;
    background:var(--rule);
    margin:8px 0 22px;
    overflow:hidden;
  }
  .bar span{
    display:block;
    height:100%;
    width:0;
    background:var(--done);
    transition:width .25s ease;
  }

  ul{list-style:none;margin:0;padding:0}
  li{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    border-bottom:1px solid var(--rule);
  }
  li:first-child{border-top:1px solid var(--rule)}

  /* hand-drawn-ish checkbox */
  input[type=checkbox]{
    appearance:none;-webkit-appearance:none;
    flex:0 0 auto;
    width:20px;height:20px;
    margin:3px 0 0;
    border:2px solid var(--indigo);
    border-radius:3px;
    background:#fff;
    cursor:pointer;
    position:relative;
    transition:background-color .15s ease, border-color .15s ease;
  }
  input[type=checkbox]:checked{
    background:var(--done);
    border-color:var(--done);
  }
  input[type=checkbox]:checked::after{
    content:"";
    position:absolute;
    left:5px;top:1px;
    width:6px;height:11px;
    border:solid #fff;
    border-width:0 2.5px 2.5px 0;
    transform:rotate(42deg);
  }
  input[type=checkbox]:focus-visible{
    outline:2px solid var(--indigo);
    outline-offset:3px;
  }

  .item-text{
    flex:1 1 auto;
    min-width:0;
    font-size:16px;
    word-break:break-word;
    outline:none;
    padding:1px 2px;
    border-radius:2px;
  }
  .item-text:focus-visible{
    background:linear-gradient(transparent 66%, var(--highlighter) 66%);
  }
  li.done .item-text{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--done);
    text-decoration-thickness:2px;
  }

  .remove{
    flex:0 0 auto;
    border:0;
    background:none;
    color:#C3BBAC;
    font-size:20px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
    border-radius:3px;
  }
  .remove:hover,.remove:focus-visible{color:var(--margin-line)}
  .remove:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

  .empty{
    margin:0;
    padding:26px 0;
    color:var(--ink-soft);
    font-size:15px;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }

  form{display:flex;gap:10px;margin-top:22px}
  #new-item{
    flex:1 1 auto;
    min-width:0;
    font:inherit;
    font-size:16px;
    padding:11px 12px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--rule);
    border-radius:3px;
  }
  #new-item::placeholder{color:#B9B1A3}
  #new-item:focus-visible{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}
  button.add{
    flex:0 0 auto;
    font:inherit;
    font-weight:600;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#fff;
    background:var(--indigo);
    border:0;
    border-radius:3px;
    padding:11px 18px;
    cursor:pointer;
  }
  button.add:hover{background:#2C2C63}
  button.add:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}

  .tools{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--rule);
  }
  .tools button{
    font:inherit;
    font-size:13px;
    font-weight:500;
    color:var(--indigo);
    background:none;
    border:0;
    padding:2px 0;
    cursor:pointer;
    border-bottom:2px solid var(--highlighter);
  }
  .tools button:hover{color:var(--margin-line);border-bottom-color:var(--margin-line)}
  .tools button:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
  .tools button[disabled]{
    color:#B9B1A3;
    border-bottom-color:var(--rule);
    cursor:default;
  }

  .note{
    margin-top:28px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
  @media (max-width:480px){
    .sheet{padding:24px 18px 22px 34px}
    .sheet::before{left:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sheet">

    <h1 id="list-title" contenteditable="true" spellcheck="false"
        data-placeholder="Untitled list"
        aria-label="List title, editable">Checklist</h1>
    <p class="title-hint">Click the title to rename it. Click any item to edit the wording.</p>

    <p class="count" id="count">0 of 0 done</p>
    <div class="bar" aria-hidden="true"><span id="bar-fill"></span></div>

    <ul id="items" aria-live="polite"></ul>
    <p class="empty" id="empty">Nothing on the list yet. Add the first thing below.</p>

    <form id="add-form">
      <label class="visually-hidden" for="new-item" style="position:absolute;left:-9999px">New item</label>
      <input id="new-item" type="text" placeholder="Add an item and press Enter" autocomplete="off">
      <button class="add" type="submit">Add</button>
    </form>

    <div class="tools">
      <button type="button" id="uncheck-all">Uncheck everything</button>
      <button type="button" id="clear-done">Clear checked items</button>
      <button type="button" id="clear-all">Start over</button>
    </div>

  </div>
  <p class="note" id="storage-note">Saved in this browser only — the list stays on this device and is not sent anywhere.</p>
</div>

<script>
(function () {
  var KEY = 'qgreg.checklist.v1';

  var titleEl = document.getElementById('list-title');
  var listEl = document.getElementById('items');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var fillEl = document.getElementById('bar-fill');
  var formEl = document.getElementById('add-form');
  var inputEl = document.getElementById('new-item');
  var noteEl = document.getElementById('storage-note');

  var state = { title: 'Checklist', items: [] };
  var canStore = true;

  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (typeof saved.title === 'string') state.title = saved.title;
        if (Array.isArray(saved.items)) {
          state.items = saved.items
            .filter(function (it) { return it && typeof it.text === 'string'; })
            .map(function (it) { return { text: it.text, done: !!it.done }; });
        }
      }
    } catch (e) {
      canStore = false;
    }
  }

  function save() {
    if (!canStore) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      canStore = false;
      noteEl.textContent = 'This browser is not saving the list, so it will reset when you leave the page.';
    }
  }

  function updateProgress() {
    var total = state.items.length;
    var done = state.items.filter(function (it) { return it.done; }).length;
    countEl.textContent = done + ' of ' + total + ' done';
    fillEl.style.width = total ? (done / total * 100) + '%' : '0%';
    emptyEl.hidden = total > 0;
    document.getElementById('uncheck-all').disabled = done === 0;
    document.getElementById('clear-done').disabled = done === 0;
    document.getElementById('clear-all').disabled = total === 0;
  }

  function render() {
    titleEl.textContent = state.title;
    listEl.textContent = '';

    state.items.forEach(function (item, index) {
      var li = document.createElement('li');
      if (item.done) li.className = 'done';

      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = item.done;
      box.setAttribute('aria-label', item.text);
      box.addEventListener('change', function () {
        state.items[index].done = box.checked;
        li.classList.toggle('done', box.checked);
        updateProgress();
        save();
      });

      var text = document.createElement('span');
      text.className = 'item-text';
      text.textContent = item.text;
      text.contentEditable = 'true';
      text.spellcheck = false;
      text.addEventListener('blur', function () {
        var next = text.textContent.trim();
        if (next) {
          state.items[index].text = next;
          box.setAttribute('aria-label', next);
        } else {
          text.textContent = state.items[index].text;
        }
        save();
      });
      text.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      });

      var remove = document.createElement('button');
      remove.className = 'remove';
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', 'Remove ' + item.text);
      remove.addEventListener('click', function () {
        state.items.splice(index, 1);
        render();
        save();
      });

      li.appendChild(box);
      li.appendChild(text);
      li.appendChild(remove);
      listEl.appendChild(li);
    });

    updateProgress();
  }

  titleEl.addEventListener('blur', function () {
    var next = titleEl.textContent.trim();
    state.title = next || 'Untitled list';
    titleEl.textContent = state.title;
    save();
  });
  titleEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
  });

  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var value = inputEl.value.trim();
    if (!value) return;
    state.items.push({ text: value, done: false });
    inputEl.value = '';
    render();
    save();
    inputEl.focus();
  });

  document.getElementById('uncheck-all').addEventListener('click', function () {
    state.items.forEach(function (it) { it.done = false; });
    render();
    save();
  });

  document.getElementById('clear-done').addEventListener('click', function () {
    state.items = state.items.filter(function (it) { return !it.done; });
    render();
    save();
  });

  document.getElementById('clear-all').addEventListener('click', function () {
    if (!state.items.length) return;
    if (!window.confirm('Remove every item from this list?')) return;
    state.items = [];
    render();
    save();
  });

  load();
  if (!canStore) {
    noteEl.textContent = 'This browser is not saving the list, so it will reset when you leave the page.';
  }
  render();
})();
</script>
</body>
</html>
