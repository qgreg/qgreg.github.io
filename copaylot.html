<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoPaylot — Medical Copayment Submitter</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Emotion & Material UI v5 -->
  <script src="https://unpkg.com/@emotion/react@11/umd/emotion-react.umd.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/umd/emotion-styled.umd.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js" crossorigin></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="root" style="width: 100%;"></div>

  <script type="text/babel">
    const { useState, useRef } = React;
    const { 
      Box, Button, Card, CardContent, Container, TextField, 
      Typography, Alert, CircularProgress, Paper, InputAdornment,
      ThemeProvider, createTheme, CssBaseline, Fade
    } = MaterialUI;

    const darkTheme = createTheme({
      palette: {
        mode: 'dark',
        primary: {
          main: '#3b82f6',
          light: '#60a5fa',
          dark: '#2563eb',
        },
        secondary: {
          main: '#8b5cf6',
        },
        background: {
          paper: '#1e293b',
          default: '#0b0f19',
        },
        text: {
          primary: '#f8fafc',
          secondary: '#94a3b8',
        },
      },
      typography: {
        fontFamily: '"Plus Jakarta Sans", sans-serif',
      },
      shape: {
        borderRadius: 16,
      },
    });

    function CoPaylotApp() {
      const [vendor, setVendor] = useState('');
      const [amount, setAmount] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState(null);
      const fileInputRef = useRef(null);

      const BACKEND_URL = 'https://copaylot-app-gqw-249890932744.us-east1.run.app/api/receipts';

      const handleFileChange = (e) => {
        const selectedFile = e.target.files[0];
        if (selectedFile) {
          setFile(selectedFile);
          const reader = new FileReader();
          reader.onloadend = () => {
            setPreview(reader.result);
          };
          reader.readAsDataURL(selectedFile);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file || !preview) {
          setStatus({ type: 'error', message: 'Please snap or attach a receipt photo.' });
          return;
        }

        setLoading(true);
        setStatus(null);

        const base64String = preview.split(',')[1];
        const payload = {
          vendor,
          amount,
          date,
          imageBase64: base64String,
          mimeType: file.type || 'image/jpeg'
        };

        try {
          const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (response.ok) {
            setStatus({ 
              type: 'success', 
              message: `Receipt submitted successfully! Reference ID: ${result.id}` 
            });
            setVendor('');
            setAmount('');
            setDate(new Date().toISOString().split('T')[0]);
            setFile(null);
            setPreview(null);
            if (fileInputRef.current) fileInputRef.current.value = '';
          } else {
            throw new Error(result.error || 'Failed to submit receipt.');
          }
        } catch (err) {
          setStatus({ type: 'error', message: err.message || 'Network error submitting receipt.' });
        } finally {
          setLoading(false);
        }
      };

      return (
        <ThemeProvider theme={darkTheme}>
          <CssBaseline />
          <Container maxWidth="xs" sx={{ py: 4 }}>
            <Card 
              elevation={8} 
              sx={{ 
                background: 'rgba(30, 41, 59, 0.75)', 
                backdropFilter: 'blur(16px)',
                border: '1px solid rgba(255, 255, 255, 0.1)',
                boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5)'
              }}
            >
              <CardContent sx={{ p: 3 }}>
                <Box textAlign="center" mb={3}>
                  <Typography variant="h5" component="h1" fontWeight={800} color="primary.light">
                    CoPaylot
                  </Typography>
                  <Typography variant="body2" color="text.secondary" mt={0.5}>
                    Medical Copayment Receipt Submitter
                  </Typography>
                </Box>

                {status && (
                  <Fade in={Boolean(status)}>
                    <Alert 
                      severity={status.type} 
                      sx={{ mb: 3, borderRadius: 2 }}
                      onClose={() => setStatus(null)}
                    >
                      {status.message}
                    </Alert>
                  </Fade>
                )}

                <form onSubmit={handleSubmit}>
                  <Box display="flex" flexDirection="column" gap={2.5}>
                    <TextField
                      label="Provider / Vendor"
                      placeholder="e.g. Pediatric Dentist"
                      value={vendor}
                      onChange={(e) => setVendor(e.target.value)}
                      required
                      fullWidth
                      variant="outlined"
                    />

                    <TextField
                      label="Amount ($)"
                      type="number"
                      inputProps={{ step: '0.01', min: '0' }}
                      placeholder="0.00"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      required
                      fullWidth
                      variant="outlined"
                      InputProps={{
                        startAdornment: <InputAdornment position="start">$</InputAdornment>,
                      }}
                    />

                    <TextField
                      label="Date of Service"
                      type="date"
                      value={date}
                      onChange={(e) => setDate(e.target.value)}
                      required
                      fullWidth
                      variant="outlined"
                      InputLabelProps={{ shrink: true }}
                    />

                    <Box>
                      <input
                        accept="image/*"
                        capture="environment"
                        style={{ display: 'none' }}
                        id="receipt-photo-input"
                        type="file"
                        ref={fileInputRef}
                        onChange={handleFileChange}
                      />
                      <label htmlFor="receipt-photo-input">
                        <Button
                          variant="outlined"
                          component="span"
                          fullWidth
                          sx={{ 
                            py: 1.5, 
                            borderStyle: 'dashed',
                            borderWidth: 2,
                            borderColor: file ? 'primary.main' : 'rgba(255, 255, 255, 0.2)',
                            '&:hover': { borderWidth: 2, borderColor: 'primary.light' }
                          }}
                        >
                          {file ? `Photo Selected: ${file.name.substring(0, 18)}...` : '📷 Snap or Attach Receipt Photo'}
                        </Button>
                      </label>
                    </Box>

                    {preview && (
                      <Box 
                        sx={{ 
                          borderRadius: 2, 
                          overflow: 'hidden', 
                          border: '1px solid rgba(255, 255, 255, 0.1)',
                          maxHeight: 180,
                          display: 'flex',
                          justifyContent: 'center',
                          alignItems: 'center',
                          backgroundColor: '#0f172a'
                        }}
                      >
                        <img 
                          src={preview} 
                          alt="Receipt Preview" 
                          style={{ maxWidth: '100%', maxHeight: '180px', objectFit: 'contain' }} 
                        />
                      </Box>
                    )}

                    <Button
                      type="submit"
                      variant="contained"
                      size="large"
                      disabled={loading}
                      fullWidth
                      sx={{ 
                        py: 1.6, 
                        fontWeight: 700,
                        fontSize: '1rem',
                        background: 'linear-gradient(135deg, #2563eb 0%, #7c3aed 100%)',
                        boxShadow: '0 4px 14px 0 rgba(37, 99, 235, 0.39)',
                        '&:hover': {
                          background: 'linear-gradient(135deg, #1d4ed8 0%, #6d28d9 100%)',
                        }
                      }}
                    >
                      {loading ? (
                        <Box display="flex" alignItems="center" gap={1.5}>
                          <CircularProgress size={22} color="inherit" />
                          <span>Submitting...</span>
                        </Box>
                      ) : (
                        'Send for Approval'
                      )}
                    </Button>
                  </Box>
                </form>
              </CardContent>
            </Card>
          </Container>
        </ThemeProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CoPaylotApp />);
  </script>
</body>
</html>
